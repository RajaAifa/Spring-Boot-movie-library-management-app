<!DOCTYPE html>
<html lang="en">
<html xmlns:th="http://www.thymeleaf.org">
<head th:fragment="headerfiles">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
</head>
<body>
<div th:fragment="header">
    <nav class="navbar navbar-expand-sm bg-dark navbar-dark">
        <div class="container-fluid">
            <span class="navbar-brand">Filmothèque</span>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link" href="/film/all">Gestion des films</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/acteur/all">Gestion des acteurs</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/categorie/all">Gestion des categorie</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
    <script>
        // Get the current URL
        const currentUrl = window.location.pathname;

        // Find all nav links
        const navLinks = document.querySelectorAll('.navbar-nav .nav-link');

        // Loop through the links and check if the href matches the current URL
        navLinks.forEach(link => {
            if (currentUrl.startsWith(link.getAttribute('href'))) {
                // Add 'active' class to the matching link
                link.classList.add('active');
            }
        });
    </script>
</div>
</body>
</html>
